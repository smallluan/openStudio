<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Studio</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1419;
      color: #e6edf3;
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 { font-weight: 600; margin: 0 0 0.5rem; }
    p { opacity: 0.8; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Open Studio</h1>
    <p>Electron 已就绪。运行 <code>npm start</code> 启动应用。</p>
  </main>
  <script>
    const title = document.getElementById("title");
    if (window.appInfo?.name) title.textContent = window.appInfo.name;
  </script>
</body>
</html>
