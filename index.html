<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("openstudio_theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
            return;
          }
        } catch (e) {}
        document.documentElement.dataset.theme = "light";
      })();
      (function () {
        try {
          var loc = localStorage.getItem("openstudio_locale");
          if (
            loc === "zh-CN" ||
            loc === "zh-TW" ||
            loc === "en" ||
            loc === "ja"
          ) {
            document.documentElement.lang = loc;
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
